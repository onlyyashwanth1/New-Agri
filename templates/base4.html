<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    {% block extra_css %}{% endblock %}
    <style>
        .sidebar {
            position: fixed;
            top: 75px;
            left: 0;
            height: calc(100vh - 75px);
            width: 16rem;
            padding: 1rem;
            background: #e5e7eb;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            z-index: 20;
            transform: translateX(-100%);
            transition: transform 0.25s ease;
            overflow-y: auto;
        }

        .sidebar.active {
            transform: translateX(0);
        }

        .content {
            transition: margin-left 0.25s ease;
        }

        .sidebar-toggle {
            background-color: #2563eb;
            color: white;
            padding: 0.45rem 0.7rem;
            border-radius: 0.375rem;
            font-size: 1.1rem;
            line-height: 1;
            cursor: pointer;
        }

        .sidebar-toggle:hover {
            background-color: #1d4ed8;
        }

        .link-item {
            display: block;
            padding: 12px 16px;
            text-decoration: none;
            color: #2d3748;
            transition: background-color 0.2s ease, color 0.2s ease;
            border-radius: 5px;
            margin-bottom: 4px;
        }

        .link-item:hover {
            background-color: #d1d5db;
        }

        .link-item.active {
            background-color: #3b82f6;
            color: white;
            font-weight: bold;
        }

        .logout-btn {
            background-color: #f56565;
            color: white;
            padding: 0.4rem 0.5rem;
            border-radius: 0.375rem;
            transition: background-color 0.2s;
        }

        .logout-btn:hover {
            background-color: #e53e3e;
        }
    </style>
</head>
<body class="bg-gray-100">
    <nav class="bg-white shadow fixed top-0 left-0 w-full z-30">
        <div class="w-full flex justify-between items-center py-4 px-4 md:px-6">
            <div class="flex items-center">
                <button class="sidebar-toggle mr-3" onclick="toggleSidebar()" aria-label="Toggle navigation">☰</button>
                <h1 class="text-xl font-bold text-gray-800">{{ session.get('farmer_name', 'Farmer') }}</h1>
            </div>
            <a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
        </div>
    </nav>

    <div id="sidebar" class="sidebar">
        <ul>
            <li><a href="{{ url_for('farmer_details') }}" class="link-item">Details</a></li>
            <li><a href="{{url_for('farmer_lands')}}" class="link-item">Lands</a></li>
            <li><a href="{{url_for('farmer_crops')}}" class="link-item">Crops</a></li>
            <li><a href="{{ url_for('farmer_loans_taken') }}" class="link-item">Loans Taken</a></li>
            <li><a href="{{ url_for('farmer_subsidies_taken') }}" class="link-item">Subsidies Taken</a></li>
            <li><a href="{{ url_for('farmer_schemes_taken') }}" class="link-item">Schemes Taken</a></li>
            <li><a href="{{ url_for('farmer_applications') }}" class="link-item">My Applications</a></li>
            <li><a href="{{ url_for('farmer_weather') }}" class="link-item">Weather & Irrigation</a></li>
            <li><a href="{{ url_for('change_password') }}" class="link-item">Change Password</a></li>
        </ul>
    </div>

    <div id="mainContent" class="content pt-20 pl-4 md:pl-0 flex justify-center items-center">
        <div class="w-full max-w-3xl px-4">
            {% block content %}{% endblock %}
        </div>
    </div>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const content = document.getElementById('mainContent');
            sidebar.classList.toggle('active');
            content.classList.toggle('sidebar-open');
        }

        document.querySelectorAll('.link-item').forEach(link => {
            link.addEventListener('click', function() {
                document.querySelectorAll('.link-item').forEach(item => item.classList.remove('active'));
                this.classList.add('active');
            });
        });
    </script>
</body>
</html>
